<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
<body>
    <h1 id="greeting-display">

    <script>
        async function greet() {
            try {
                const response = await fetch('/'); 
                const message = await response.text();
                document.getElementById('greeting-display').innerText = message;
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('greeting-display').innerText = "Backend Offline";
            }
        }

        greet();
    </script>
</body>
</html>
